apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omkar-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omkar-service
                port:
                  number: 8000
           - path: /omkar
            pathType: Prefix
            backend:
              service:
                name: omkar-service
                port:
                  number: 8000
           
