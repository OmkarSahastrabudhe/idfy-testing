apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: omkar-app
  labels:
    app: omkar 
spec:
  
  selector:
    matchLabels:
      app: omkar
  template:
    metadata: 
      name: omkar-pod 
      labels: 
        app: omkar
    spec: 
      containers: 
        - name: omkar-container  
          image:  omkarsahastrabudhe/idfy-arm64:latest
          ports: 
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"



            
