# VictoriaMetrics single-node: discovers node-exporter pods, scrapes them, stores the data
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
---
# Permission to discover targets through the Kubernetes API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-discovery
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-discovery
subjects:
  - kind: ServiceAccount
    name: victoriametrics
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape
data:
  scrape.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # Every node-exporter pod, found automatically via the Kubernetes API
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      # VictoriaMetrics' own metrics
      - job_name: victoriametrics
        static_configs:
          - targets: ["localhost:8428"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  labels:
    app: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      serviceAccountName: victoriametrics
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.154.1
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=7d
            - -httpListenAddr=:8428
            - -promscrape.config=/etc/vm/scrape.yml
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: scrape-config
              mountPath: /etc/vm
      volumes:
        - name: scrape-config
          configMap:
            name: victoriametrics-scrape
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  labels:
    app: victoriametrics
spec:
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
