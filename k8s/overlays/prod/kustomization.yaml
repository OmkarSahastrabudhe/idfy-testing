apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../bases

replicas:
  - name: omkar-app
    count: 5
patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: omkar-service  # Replace with the actual Service name defined in ../../bases/Service.yaml
        
      spec:
        type: LoadBalancer


